<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>와벨리 — 2026 춘천닭갈비·막국수축제</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0A0C0E; --card: #14171A; --card2: #1B1F23; --chip: #1A1D21;
    --line: #24282C; --ink: #F1F3F5; --ink2: #9AA1A8; --ink3: #5E646B;
    --blue: #34A8E1; --blue-deep: #2492CC; --blue-soft: rgba(52,168,225,.14);
    --warm: #E9603F; --warm-soft: rgba(233,96,63,.15); --green: #17A75C;
  }
  html, body { background: #000; height: 100%; }
  body { font-family: 'Pretendard Variable', Pretendard, system-ui, sans-serif; letter-spacing: -0.02em; word-break: keep-all; -webkit-font-smoothing: antialiased; display: flex; justify-content: center; }
  .phone { width: 402px; height: 860px; background: var(--bg); color: var(--ink); position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .scroll { flex: 1; overflow-y: auto; }
  .scroll::-webkit-scrollbar { display: none; }

  /* 상단바 */
  .top { position: sticky; top: 0; z-index: 12; background: var(--bg); display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; }
  .back { width: 40px; height: 40px; border-radius: 11px; background: var(--card); display: flex; align-items: center; justify-content: center; color: var(--ink); flex: none; }
  .top-t { flex: 1; font-size: 16px; font-weight: 800; }
  .top-ic { width: 40px; height: 40px; border-radius: 11px; display: flex; align-items: center; justify-content: center; color: var(--ink2); }

  /* 히어로 */
  .hero { margin: 4px 16px 0; border-radius: 20px; padding: 22px; background: linear-gradient(135deg, #2A1410 0%, #16223A 100%); position: relative; overflow: hidden; border: 1px solid var(--line); }
  .hero::after { content: ''; position: absolute; right: -30px; top: -30px; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, rgba(233,96,63,.35), transparent 70%); }
  .hero-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; color: #fff; background: var(--warm); padding: 4px 10px; border-radius: 999px; letter-spacing: .02em; }
  .hero h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.04em; margin-top: 12px; line-height: 1.2; position: relative; }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 13px; color: #C9D0D6; font-weight: 600; position: relative; }
  .hero-meta span { display: inline-flex; align-items: center; gap: 5px; }
  .hero-dday { position: absolute; right: 20px; bottom: 20px; font-size: 13px; font-weight: 800; color: var(--warm); background: rgba(0,0,0,.35); padding: 6px 12px; border-radius: 10px; }

  /* 서브탭 */
  .subtabs { display: flex; gap: 6px; padding: 16px 16px 4px; position: sticky; top: 64px; background: var(--bg); z-index: 11; }
  .subtab { flex: 1; height: 40px; border-radius: 12px; background: var(--chip); color: var(--ink2); font-size: 13.5px; font-weight: 700; transition: all .15s; }
  .subtab.on { background: var(--blue); color: #fff; }

  .pane { padding: 8px 16px 24px; }
  .pane.hide { display: none; }

  /* 데이 선택 */
  .days { display: flex; gap: 8px; padding: 10px 0 4px; }
  .day { flex: 1; height: 56px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: all .15s; }
  .day .dnum { font-size: 16px; font-weight: 800; }
  .day .ddow { font-size: 11px; color: var(--ink3); font-weight: 700; }
  .day.on { background: var(--blue); border-color: var(--blue); }
  .day.on .ddow { color: rgba(255,255,255,.85); }

  /* 타임라인 */
  .tl { margin-top: 16px; position: relative; padding-left: 18px; }
  .tl::before { content: ''; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
  .tlrow { position: relative; padding: 0 0 20px 16px; }
  .tlrow::before { content: ''; position: absolute; left: -18px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); border: 2px solid var(--bg); }
  .tlrow.warm::before { background: var(--warm); }
  .tlrow.big::before { width: 13px; height: 13px; left: -19px; box-shadow: 0 0 0 3px var(--blue-soft); }
  .tl-time { font-size: 13px; font-weight: 800; color: var(--blue); }
  .tlrow.warm .tl-time { color: var(--warm); }
  .tl-card { margin-top: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; }
  .tl-title { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; }
  .tl-loc { font-size: 12.5px; color: var(--ink2); margin-top: 5px; display: inline-flex; align-items: center; gap: 4px; }
  .tl-tag { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; margin-bottom: 8px; }
  .tag-show { color: var(--blue); background: var(--blue-soft); }
  .tag-food { color: var(--warm); background: var(--warm-soft); }
  .tag-exp { color: var(--green); background: rgba(23,167,92,.14); }

  /* 지도 */
  .map { position: relative; height: 420px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); margin-top: 10px;
    --m-land: #10151A; --m-plaza: #16202A; --m-green: #14241C; --m-water: #133040; --m-road: #232A31; --m-label: #6E7A84; }
  .map svg.base { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mlabel { position: absolute; transform: translate(-50%,-50%); font-size: 10.5px; font-weight: 700; color: var(--m-label); pointer-events: none; }
  .pin { position: absolute; transform: translate(-50%,-100%); display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .pin-b { width: 30px; height: 30px; border-radius: 50% 50% 50% 2px; transform: rotate(45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(0,0,0,.4); border: 2px solid #fff; }
  .pin-b span { transform: rotate(-45deg); color: #fff; font-size: 13px; font-weight: 800; display: flex; }
  .pin.zone .pin-b { background: var(--blue); }
  .pin.zone.active .pin-b { background: var(--blue-deep); transform: rotate(45deg) scale(1.15); }
  .pin-lb { margin-top: 6px; font-size: 10.5px; font-weight: 800; color: var(--ink); background: rgba(10,12,14,.85); padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
  .pin.dak .pin-b { width: 26px; height: 26px; background: var(--warm); }
  .pin.mak .pin-b { width: 26px; height: 26px; background: var(--blue); }
  .pin.food .pin-lb { opacity: 0; transition: opacity .15s; }
  .pin.food.active .pin-lb, .pin.food:hover .pin-lb { opacity: 1; }
  .pin.food.active .pin-b { transform: rotate(45deg) scale(1.18); box-shadow: 0 0 0 3px rgba(255,255,255,.18), 0 3px 8px rgba(0,0,0,.4); }

  .maplegend { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 12px; background: rgba(10,12,14,.8); padding: 7px 11px; border-radius: 10px; }
  .maplegend span { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--ink2); }
  .maplegend i { width: 9px; height: 9px; border-radius: 50%; }

  .maphint { margin-top: 12px; font-size: 12.5px; color: var(--ink3); font-weight: 600; text-align: center; }
  .food-filter { display: flex; gap: 6px; padding: 8px 0 12px; }
  .ff { height: 32px; padding: 0 15px; border-radius: 999px; background: var(--chip); color: var(--ink2); font-size: 13px; font-weight: 700; }
  .ff.on { background: var(--blue); color: #fff; }
  .ff.on[data-k="dak"] { background: var(--warm); }

  /* 바텀 시트 */
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .22s; z-index: 40; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--card); border-radius: 22px 22px 0 0; border-top: 1px solid var(--line); padding: 8px 18px 24px; transform: translateY(100%); transition: transform .28s cubic-bezier(.32,.72,.28,1); max-height: 74%; overflow-y: auto; }
  .sheet.on { transform: translateY(0); }
  .sheet::-webkit-scrollbar { display: none; }
  .sheet-grip { width: 38px; height: 4px; border-radius: 999px; background: var(--line); margin: 6px auto 14px; }
  .sheet-h { display: flex; align-items: center; gap: 9px; }
  .sheet-ic { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; flex: none; }
  .sheet-tt { font-size: 18px; font-weight: 800; }
  .sheet-sub { font-size: 12.5px; color: var(--ink2); margin-top: 3px; }
  .sheet-evt { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .sheet-evt:first-of-type { border-top: none; }
  .sheet-evt-t { font-size: 13px; font-weight: 800; color: var(--blue); white-space: nowrap; min-width: 78px; }
  .sheet-evt.warm .sheet-evt-t { color: var(--warm); }
  .sheet-evt-b { font-size: 14px; font-weight: 700; }
  .sheet-evt-d { font-size: 12px; color: var(--ink2); margin-top: 2px; }
  .sheet-empty { padding: 20px 0; text-align: center; color: var(--ink3); font-size: 13px; }

  /* 업체 카드(맛집 핀) */
  .vc-head { display: flex; gap: 13px; align-items: center; margin-top: 4px; }
  .vc-logo { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #fff; flex: none; }
  .vc-nm { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
  .vc-badge { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 999px; }
  .vc-meta { font-size: 13px; color: var(--ink2); margin-top: 4px; }
  .vc-star { color: #F2B23C; font-weight: 800; }
  .vc-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
  .vc-tag { font-size: 12px; font-weight: 700; color: var(--ink2); background: var(--card2); padding: 6px 11px; border-radius: 8px; }
  .vc-note { margin-top: 14px; padding: 12px 14px; background: var(--warm-soft); border-radius: 12px; font-size: 13px; color: #F0A48C; font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .vc-btn { width: 100%; height: 48px; margin-top: 16px; border-radius: 13px; background: var(--blue); color: #fff; font-size: 15px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }

  /* 하단 탭바 */
  .tabbar { flex: none; height: 66px; background: #0D0F12; border-top: 1px solid var(--line); display: flex; padding: 0 6px 4px; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink3); font-size: 11px; font-weight: 600; padding-top: 8px; }
  .tab.on { color: var(--blue); }
</style>
</head>

      { id: 'v2', name: '우성 닭갈비', kind: 'dak', x: 58, y: 46, rating: 4.6, reviews: 980, dist: '축제장 260m', tags: ['철판닭갈비', '포장 가능'], note: '축제 부스 운영중' },
      { id: 'v3', name: '명동 닭갈비골목 본점', kind: 'dak', x: 46, y: 62, rating: 4.7, reviews: 1520, dist: '축제장 180m', tags: ['골목 노포', '단체석'], note: '' },
      { id: 'v4', name: '부안 막국수', kind: 'mak', x: 66, y: 34, rating: 4.9, reviews: 1730, dist: '축제장 300m', tags: ['들기름 막국수', '수육'], note: '축제 한정 비빔 세트' },
      { id: 'v5', name: '샘밭 막국수', kind: 'mak', x: 24, y: 66, rating: 4.5, reviews: 640, dist: '축제장 420m', tags: ['메밀 100%', '온막국수'], note: '' },
      { id: 'v6', name: '유포리 막국수', kind: 'mak', x: 72, y: 66, rating: 4.7, reviews: 1120, dist: '축제장 350m', tags: ['70년 전통', '편육'], note: '축제 셔틀 정차' },
    ];

    let day = 'd1', foodKind = 'all';
    const $ = (id) => document.getElementById(id);

    // 데이 + 타임라인
    function renderDays() {
      $('days').innerHTML = DAYS.map((d) => `<button class="day${d.key === day ? ' on' : ''}" data-day="${d.key}"><span class="dnum">${d.num}</span><span class="ddow">${d.dow}</span></button>`).join('');
    }
    function renderTL() {
      $('tl').innerHTML = EVENTS[day].map((e) => `
        <div class="tlrow ${e.type === 'food' ? 'warm' : ''}${e.big ? ' big' : ''}">
          <div class="tl-time">${e.t}</div>
          <div class="tl-card">
            <span class="tl-tag ${e.type === 'food' ? 'tag-food' : e.type === 'exp' ? 'tag-exp' : 'tag-show'}">${TAGLABEL[e.type]}</span>
            <div class="tl-title">${e.title}</div>
            <div class="tl-loc"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>${e.loc}</div>
          </div>
        </div>`).join('');
    }
    $('days').addEventListener('click', (e) => { const b = e.target.closest('.day'); if (!b) return; day = b.dataset.day; renderDays(); renderTL(); });

    // 지도 베이스 (축제장 벡터)
    const MAPBASE = `<svg class="base" viewBox="0 0 100 100" preserveAspectRatio="none">
      <rect width="100" height="100" fill="var(--m-land)"/>
      <ellipse cx="50" cy="38" rx="42" ry="30" fill="var(--m-plaza)"/>
      <path d="M-2,88 Q25,80 50,86 Q75,92 102,84 L102,102 L-2,102 Z" fill="var(--m-water)"/>
      <ellipse cx="16" cy="20" rx="14" ry="10" fill="var(--m-green)"/>
      <ellipse cx="86" cy="60" rx="13" ry="11" fill="var(--m-green)"/>
      <g stroke="var(--m-road)" fill="none" vector-effect="non-scaling-stroke">
        <path d="M50,-2 L50,88" stroke-width="9"/>
        <path d="M4,50 Q50,44 96,52" stroke-width="7"/>
        <path d="M20,84 Q50,74 80,80" stroke-width="5"/>
      </g>
    </svg>`;

    function renderVenueMap() {
      const el = $('venueMap');
      el.querySelectorAll('.pin,.mlabel,.base').forEach((n) => n.remove());
      el.insertAdjacentHTML('afterbegin', MAPBASE);
      el.insertAdjacentHTML('beforeend', '<div class="mlabel" style="left:50%;top:12%">공지천 축제장</div>');
      ZONES.forEach((z) => {
        el.insertAdjacentHTML('beforeend', `<div class="pin zone" data-zone="${z.id}" style="left:${z.x}%;top:${z.y}%"><div class="pin-b"><span>${z.n}</span></div><div class="pin-lb">${z.name}</div></div>`);
      });
    }
    function renderFoodMap() {
      const el = $('foodMap');
      el.querySelectorAll('.pin,.mlabel,.base').forEach((n) => n.remove());
      el.insertAdjacentHTML('afterbegin', MAPBASE);
      VENDORS.filter((v) => foodKind === 'all' || v.kind === foodKind).forEach((v) => {
        const ic = v.kind === 'dak'
          ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v18M11 3v7M7 10h4M17 3c-1.2 1-1.8 3-1.8 6.5h3.4"/></svg>'
          : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16M5 8c0 6 3 11 7 11s7-5 7-11"/></svg>';
        el.insertAdjacentHTML('beforeend', `<div class="pin food ${v.kind}" data-vendor="${v.id}" style="left:${v.x}%;top:${v.y}%"><div class="pin-b"><span>${ic}</span></div><div class="pin-lb">${v.name}</div></div>`);
      });
    }
    $('foodFilter').addEventListener('click', (e) => { const b = e.target.closest('.ff'); if (!b) return; foodKind = b.dataset.k; document.querySelectorAll('.ff').forEach((x) => x.classList.toggle('on', x === b)); renderFoodMap(); });

    // 시트
    const scrim = $('scrim'), sheet = $('sheet');
    function openSheet(html) { $('sheetBody').innerHTML = html; scrim.classList.add('on'); sheet.classList.add('on'); }
    function closeSheet() { scrim.classList.remove('on'); sheet.classList.remove('on'); }
    scrim.addEventListener('click', closeSheet);

    function zoneSheet(z) {
      const evts = [];
      Object.keys(EVENTS).forEach((dk) => EVENTS[dk].forEach((e) => { if (e.zone === z.id) evts.push({ ...e, d: DAYS.find((x) => x.key === dk) }); }));
      const rows = evts.length ? evts.map((e) => `<div class="sheet-evt ${e.type === 'food' ? 'warm' : ''}"><div class="sheet-evt-t">${e.d.num}(${e.d.dow}) ${e.t}</div><div><div class="sheet-evt-b">${e.title}</div><div class="sheet-evt-d">${TAGLABEL[e.type]}</div></div></div>`).join('') : '<div class="sheet-empty">등록된 행사가 없어요</div>';
      openSheet(`<div class="sheet-h"><div class="sheet-ic" style="background:var(--blue)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${z.ic}"/></svg></div><div><div class="sheet-tt">${z.name}</div><div class="sheet-sub">${z.n}번 구역 · 전체 일정</div></div></div><div style="margin-top:14px">${rows}</div>`);
    }
    function vendorSheet(v) {
      const isDak = v.kind === 'dak';
      const kindLabel = isDak ? '닭갈비' : '막국수';
      const col = isDak ? 'var(--warm)' : 'var(--blue)';
      const soft = isDak ? 'var(--warm-soft)' : 'var(--blue-soft)';
      openSheet(`
        <div class="vc-head">
          <div class="vc-logo" style="background:${col}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${isDak ? '<path d="M7 3v18M11 3v7M7 10h4M17 3c-1.2 1-1.8 3-1.8 6.5h3.4"/>' : '<path d="M4 8h16M5 8c0 6 3 11 7 11s7-5 7-11"/>'}</svg></div>
          <div><div class="vc-nm">${v.name} <span class="vc-badge" style="color:${col};background:${soft}">${kindLabel}</span></div><div class="vc-meta"><span class="vc-star">★ ${v.rating}</span> · 리뷰 ${v.reviews.toLocaleString()} · ${v.dist}</div></div>
        </div>
        <div class="vc-tags">${v.tags.map((t) => `<span class="vc-tag">${t}</span>`).join('')}</div>
        ${v.note ? `<div class="vc-note"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 6.8H21l-5.3 4 2 6.9L12 15.8 6.3 19.7l2-6.9L3 8.8h6.6z"/></svg>${v.note}</div>` : ''}
        <button class="vc-btn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>업체 정보 보기</button>`);
    }

    $('venueMap').addEventListener('click', (e) => { const p = e.target.closest('.pin'); if (!p) return; document.querySelectorAll('#venueMap .pin').forEach((x) => x.classList.toggle('active', x === p)); zoneSheet(ZONES.find((z) => z.id === p.dataset.zone)); });
    $('foodMap').addEventListener('click', (e) => { const p = e.target.closest('.pin'); if (!p) return; document.querySelectorAll('#foodMap .pin').forEach((x) => x.classList.toggle('active', x === p)); vendorSheet(VENDORS.find((v) => v.id === p.dataset.vendor)); });

    // 서브탭 전환
    $('subtabs').addEventListener('click', (e) => {
      const b = e.target.closest('.subtab'); if (!b) return;
      const p = b.dataset.p;
      document.querySelectorAll('.subtab').forEach((x) => x.classList.toggle('on', x === b));
      ['time', 'venue', 'food'].forEach((k) => $('pane-' + k).classList.toggle('hide', k !== p));
      closeSheet();
      if (p === 'venue') renderVenueMap();
      if (p === 'food') renderFoodMap();
    });

    renderDays(); renderTL();
  </script>
</body>
</html>
