<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국풋살연맹</title>
<meta name="description" content="한국풋살연맹 소개, 비젼&amp;목표, 풋살월드컵, 풋살역사, 구단순위, FK리그, 아마추어풋살대회 등 안내.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<!-- build:css -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<!-- /build:css -->
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>

<header class="site-header">
  <div class="utility container">
    <p class="slogan">하나의 단체, 더 큰 풋살</p>
    <ul class="utility-links">
      <li><a href="http://www.futsal.or.kr/lgn_loginLoad.action">로그인</a></li>
      <li><a href="http://www.futsal.or.kr/mem_memberAgreeLoad.action">회원가입</a></li>
    </ul>
  </div>
  <div class="bar container">
    <a class="brand" href="http://www.futsal.or.kr/home.action">
      <img class="brand-logo" src="../assets/img/brand/logo.png" alt="" width="97" height="42">한국풋살연맹
    </a>
    <button type="button" id="menu-toggle" class="menu-toggle" aria-expanded="false" aria-controls="gnb">
      <span class="burger" aria-hidden="true"></span><span class="label">전체 메뉴</span>
    </button>
    <nav id="gnb" class="gnb" aria-label="주 메뉴">
      <ul id="gnb-list" class="gnb-list"></ul>
    </nav>
  </div>
</header>

<main id="main" tabindex="-1">
  <section class="quick container" aria-labelledby="quick-h">
    <h2 id="quick-h" class="sr-only">바로가기</h2>
    <ul id="quick-list" class="quick-list"></ul>
  </section>

  <section class="container section" aria-labelledby="news-h">
    <div class="section-head">
      <h2 id="news-h">NEWS</h2>
      <a class="more-link" href="http://www.futsal.or.kr/mng_newsList.action">NEWS 더보기</a>
    </div>
    <ul id="news-list" class="news-list"></ul>
  </section>

  <div class="container section two-col">
    <section class="card" aria-labelledby="boards-h">
      <h2 id="boards-h" class="sr-only">공지사항 · 대회소식</h2>
      <div id="boards"></div>
    </section>
    <section class="card" aria-labelledby="comp-h">
      <div class="section-head">
        <h2 id="comp-h">대회일정</h2>
        <a class="more-link" href="http://www.futsal.or.kr/LeagueList.action">대회일정 더보기</a>
      </div>
      <ul id="comp-list" class="comp-list"></ul>
    </section>
  </div>

  <section class="band section" aria-labelledby="fkcup-title">
    <div class="container">
      <p class="eyebrow">FK CUP</p>
      <h2 id="fkcup-title" aria-live="polite"></h2>
      <div id="fkcup"></div>
    </div>
  </section>

  <div class="container section two-col wide-left">
    <section class="card" aria-labelledby="players-h">
      <h2 id="players-h">선수기록</h2>
      <div id="players"></div>
    </section>
    <section class="card" aria-labelledby="photo-h">
      <div class="section-head">
        <h2 id="photo-h">포토</h2>
        <a class="more-link" href="http://www.futsal.or.kr/photo.action">포토 더보기</a>
      </div>
      <ul id="photo-list" class="photo-list"></ul>
    </section>
  </div>

  <section class="container section" aria-labelledby="spon-h">
    <h2 id="spon-h">후원사</h2>
    <ul id="sponsor-list" class="sponsor-list"></ul>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div id="footer-info"></div>
    <nav aria-label="소셜 미디어"><ul id="social-list" class="social-list"></ul></nav>
  </div>
</footer>

<!-- build:js -->
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/tabs.js"></script>
<script src="js/menu.js"></script>
<script src="js/sections/home.js"></script>
<script src="js/sections/fkcup.js"></script>
<script src="js/sections/players.js"></script>
<script src="js/sections/footer.js"></script>
<script src="js/main.js"></script>
<!-- /build:js -->
</body>
</html>
